name: Testing with Pytest

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:   # adds a manual "Run workflow" button

jobs:
  # Job 1: run tests across several Python versions
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Lint with ruff
        run: ruff check src test

      - name: Run tests with coverage and generate XML report
        run: |
          pytest --junitxml=pytest-report.xml \
                 --cov=src --cov-report=term --cov-fail-under=80
        continue-on-error: false

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-results-py${{ matrix.python-version }}
          path: pytest-report.xml

      - name: Notify on success
        if: success()
        run: echo "Tests passed successfully on Python ${{ matrix.python-version }}"

      - name: Notify on failure
        if: failure()
        run: echo "Tests failed on Python ${{ matrix.python-version }}"

  # Job 2: train the model and enforce the quality gate (only if tests pass)
  train:
    needs: test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Train model and check quality gate
        run: python -m src.model

      - name: Upload model and metrics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: model-artifacts
          path: artifacts/

      - name: Notify on success
        if: success()
        run: echo "Model passed the quality gate and was saved as an artifact"

      - name: Notify on failure
        if: failure()
        run: echo "Model failed the quality gate. Check metrics.json for details"
